[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qingpu-insight"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "pyproj>=3.7,<4",
  "requests>=2.32,<3",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "responses>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
qingpu-data = "qingpu_insight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
