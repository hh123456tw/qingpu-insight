<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>青埔智價 Qingpu Insight</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="hero">
  <p class="eyebrow">桃園機場捷運 A17–A19</p>
  <h1>青埔智價 <span>Qingpu Insight</span></h1>
  <p>用官方成交資料，看懂青埔三個生活圈的價格、交易量與近期個案。</p>
  <p><a href="/admin">管理中心</a></p>
</header>
<section id="assistant-starter" class="hero" aria-labelledby="assistant-heading">
  <h2 id="assistant-heading">貼上 591 物件，開始分析</h2>
  <p class="supported-urls">
    支援
    <a href="https://sale.591.com.tw/?regionid=1&amp;metro=278&amp;station=66331,66332,66330&amp;firstRow=0&amp;shType=list&amp;type=2" target="_blank" rel="noopener noreferrer">591 中古屋</a>
    與
    <a href="https://newhouse.591.com.tw/list?regionid=6&amp;sectionid=67,78&amp;shop_id=497,498,499" target="_blank" rel="noopener noreferrer">591 新建案</a>
    的詳細頁
  </p>
  <form id="assistant-form">
    <input type="url" id="assistant-url" placeholder="https://sale.591.com.tw/home/house/detail/..." required>
    <label class="assistant-model-field" for="assistant-model">分析模型
      <select id="assistant-model" required disabled>
        <option value="">正在載入模型…</option>
      </select>
      <small id="assistant-model-help" class="model-status" aria-live="polite"></small>
    </label>
    <button type="submit" id="assistant-start" disabled>分析這個物件</button>
  </form>
  <div id="assistant-status" class="status" hidden></div>
  <div id="recent-conversations"></div>
</section>
<main>
  <section class="controls" aria-label="市場篩選">
    <label>市場
      <select id="transaction-type">
        <option value="resale">中古屋</option>
        <option value="presale">預售屋</option>
      </select>
    </label>
    <fieldset id="station-filter">
      <legend>生活圈</legend>
      <label><input type="checkbox" value="A17" checked>A17</label>
      <label><input type="checkbox" value="A18" checked>A18</label>
      <label><input type="checkbox" value="A19" checked>A19</label>
    </fieldset>
    <label>起始日期
      <input id="date-from" type="date">
    </label>
    <label>結束日期
      <input id="date-to" type="date">
    </label>
    <label>最小坪數
      <input id="area-ping-min" type="number" min="0" step="1" inputmode="decimal" placeholder="不限">
    </label>
    <label>最大坪數
      <input id="area-ping-max" type="number" min="0" step="1" inputmode="decimal" placeholder="不限">
    </label>
    <label>建物類型
      <select id="building-type">
        <option value="">全部</option>
        <option value="住宅大樓(11層含以上有電梯)">住宅大樓</option>
        <option value="華廈(10層含以下有電梯)">華廈</option>
        <option value="公寓(5樓含以下無電梯)">公寓</option>
        <option value="透天厝">透天厝</option>
      </select>
    </label>
    <label>房數
      <select id="bedrooms">
        <option value="">全部</option>
        <option value="1">1 房</option>
        <option value="2">2 房</option>
        <option value="3">3 房</option>
        <option value="4">4 房</option>
        <option value="5">5 房</option>
      </select>
    </label>
  </section>
  <section id="status" role="status" aria-live="polite"></section>
  <section class="kpis" aria-label="市場摘要">
    <article><span>中位單價</span><strong id="median-price">—</strong></article>
    <article><span>成交筆數</span><strong id="record-count">—</strong></article>
    <article><span>中位總價</span><strong id="median-total">—</strong></article>
    <article><span>資料更新至</span><strong id="latest-date">—</strong></article>
  </section>
  <section class="dashboard-grid">
    <article><h2>成交地圖</h2><div id="market-map" aria-label="成交地圖"></div></article>
    <article><h2>價格與交易量趨勢</h2><canvas id="price-trend"></canvas></article>
  </section>
  <section><h2>近期成交</h2><div id="recent-transactions"></div></section>
  <aside class="method-note">成交來自官方實價登錄；座標為門牌比對結果。僅供市場研究，不構成估價、投資或購屋建議。</aside>
  <section class="valuation-panel" aria-labelledby="valuation-title">
    <h2 id="valuation-title">AI 條件估價</h2>
    <form id="valuation-form">
      <fieldset class="basic-valuation-fields">
        <legend>基本條件</legend>
        <label>市場
          <select id="valuation-type" required>
            <option value="resale">中古屋</option>
            <option value="presale">預售屋</option>
          </select>
        </label>
        <label>生活圈
          <select id="valuation-station" required>
            <option value="A17">A17</option>
            <option value="A18">A18</option>
            <option value="A19">A19</option>
          </select>
        </label>
        <label>坪數
          <input id="valuation-area" type="number" min="5" max="200" step="0.1" required>
        </label>
        <label>建物類型
          <select id="valuation-building-type" required>
            <option value="住宅大樓(11層含以上有電梯)">住宅大樓</option>
            <option value="華廈(10層含以下有電梯)">華廈</option>
            <option value="公寓(5樓含以下無電梯)">公寓</option>
            <option value="透天厝">透天厝</option>
          </select>
        </label>
        <label>房數
          <select id="valuation-bedrooms">
            <option value="1">1 房</option>
            <option value="2">2 房</option>
            <option value="3" selected>3 房</option>
            <option value="4">4 房</option>
            <option value="5">5 房</option>
          </select>
        </label>
        <label id="valuation-age-label">屋齡
          <input id="valuation-age" type="number" min="0" max="100" step="0.1">
        </label>
        <label>目前開價（選填）
          <input id="asking-price" type="number" min="0" step="10000">
        </label>
      </fieldset>
      <fieldset class="detailed-valuation-fields">
        <legend>詳細條件</legend>
        <label>距捷運（公尺）
          <input id="valuation-distance" type="number" min="0" max="2000" required>
        </label>
        <label>廳數
          <select id="valuation-living-rooms">
            <option value="1">1 廳</option>
            <option value="2" selected>2 廳</option>
            <option value="3">3 廳</option>
          </select>
        </label>
        <label>衛數
          <select id="valuation-bathrooms">
            <option value="1">1 衛</option>
            <option value="2" selected>2 衛</option>
            <option value="3">3 衛</option>
          </select>
        </label>
        <label>所在樓層
          <input id="valuation-floor" type="number" min="1" max="50" required>
        </label>
        <label>總樓層
          <input id="valuation-total-floors" type="number" min="1" max="50" required>
        </label>
        <label>車位類型
          <select id="valuation-parking-type">
            <option value="">無車位</option>
            <option value="坡道平面">坡道平面</option>
            <option value="坡道機械">坡道機械</option>
            <option value="其他">其他</option>
          </select>
        </label>
        <label>車位面積（坪）
          <input id="valuation-parking-area" type="number" min="0" max="60" step="0.1" value="0">
        </label>
      </fieldset>
      <button type="submit">開始估價</button>
    </form>
    <div id="valuation-status" role="status" aria-live="polite"></div>
    <section id="valuation-result" hidden></section>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='display_format.js') }}"></script>
<script src="{{ url_for('static', filename='valuation_form.js') }}"></script>
<script src="{{ url_for('static', filename='home_assistant.js') }}" defer></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
